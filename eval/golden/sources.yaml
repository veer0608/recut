# The golden set. Real sources only: nothing here was written to be easy to score.
#
# Sources are capped at roughly 40k characters, which is the top of what anyone
# actually feeds a repurposing tool: a blog post, a talk, a README. The 127k
# character Fall of the Western Roman Empire article was dropped for that reason and
# not for cost. An encyclopedia entry that long is a different task, and scoring it
# here would move the headline number without telling you anything about the job.
#
# Local files are resolved relative to this file's directory, so the set is
# reproducible on a clean clone as long as the sibling repos are present. Remote
# sources are pinned by URL and can rot; a run records which ones failed to fetch
# and refuses to publish a headline number if any of them did.

sources:
  # --- markdown, long form technical writing -------------------------------
  - id: md-vidsmith
    kind: markdown
    ref: ../../../vidsmith/README.md
  - id: md-citerag
    kind: markdown
    ref: ../../../citerag/README.md
  - id: md-moneytrail
    kind: markdown
    ref: ../../../moneytrail/README.md
  - id: md-schemablind
    kind: markdown
    ref: ../../../schemablind/README.md
  - id: md-reruns
    kind: markdown
    ref: ../../../reruns/README.md
  - id: md-n8n
    kind: markdown
    ref: ../../../n8n-statement-extractor/README.md
  - id: md-geojit
    kind: markdown
    ref: ../../../geojit-report-app/README.md

  # --- articles, dense with names and figures -------------------------------
  - id: art-bank-statement
    kind: article
    ref: https://en.wikipedia.org/wiki/Bank_statement
  - id: art-double-entry
