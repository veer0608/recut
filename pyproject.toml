[project]
name = "recut"
version = "0.1.0"
description = "One source in, many derived pieces out, every claim anchored to the source."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = ["trafilatura>=1.8", "youtube-transcript-api>=0.6"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
recut = "recut.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recut*"]

[tool.setuptools.package-data]
recut = ["prompts/*.md"]
